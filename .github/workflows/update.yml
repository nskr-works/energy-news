name: ニュース更新

on:
  # GitHub は毎時0分に実行が集中して遅延・欠落しやすいため、7分にずらしている
  schedule:
    - cron: "7 22 * * *"   # 毎日 7:07 JST
    - cron: "7 2 * * *"    # 毎日 11:07 JST
    - cron: "7 5 * * *"    # 毎日 14:07 JST
    - cron: "7 8 * * *"    # 毎日 17:07 JST
  workflow_dispatch:        # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/fetch_news.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # 新着通知の宛先（未設定なら通知しない）
          SITE_URL: https://nskr-works.github.io/energy-news/

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json stats/feed_log.csv
          git diff --cached --quiet || git commit -m "ニュース更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
