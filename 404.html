<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>移転しました｜太陽光・蓄電池ニュース</title>
<link rel="canonical" href="https://energy-news.pages.dev/">
<meta http-equiv="refresh" content="5; url=https://energy-news.pages.dev/">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
       background:#f7f7f5;color:#222;padding:16px;box-sizing:border-box;text-align:center}
  @media (prefers-color-scheme:dark){body{background:#1a1a1a;color:#eee}a{color:#7cc4ff}}
  main{max-width:32rem;line-height:1.8}
  h1{font-size:1.3rem}
  a{word-break:break-all}
</style>
</head>
<body>
<main>
  <h1>このサイトは https://energy-news.pages.dev に移転しました</h1>
  <p>数秒後に新しいサイトへ移動します。<br>移動しない場合は下のリンクを開いてください。</p>
  <p><a href="https://energy-news.pages.dev/">https://energy-news.pages.dev/</a></p>
  <p>ブックマークやホーム画面のアイコンは、新しいURLで登録し直してください。</p>
</main>
<script>
  // 旧サイトの Service Worker とキャッシュを解除してから新URLへ移動する
  (async () => {
    try {
      if ("serviceWorker" in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      if (window.caches) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
    } catch (e) {}
    setTimeout(() => location.replace("https://energy-news.pages.dev/"), 4000);
  })();
</script>
</body>
</html>
